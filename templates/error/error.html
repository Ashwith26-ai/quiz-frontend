<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-custom p-5 shadow">
                <i class="bi bi-info-circle-fill text-warning display-1 mb-3"></i>
                <h3 class="fw-bold mb-3">Notice</h3>
                <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'An error occurred during this operation.'}">
                    An error occurred during this operation.
                </p>
                <div>
                    <a th:href="@{/student/dashboard}" class="btn btn-primary px-4">
                        <i class="bi bi-speedometer2 me-1"></i> Go to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
