<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Edit Quiz' : 'Create New Quiz'}">Quiz Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card card-custom p-4 p-md-5 shadow">
                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                    <div>
                        <h3 class="fw-bold mb-1" th:text="${isEdit ? 'Edit Quiz Configuration' : 'Create New Quiz'}">Create Quiz</h3>
                        <p class="text-muted small mb-0">Set duration, passing criteria, and examination details</p>
                    </div>
                    <a th:href="@{/admin/quizzes}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Cancel
                    </a>
                </div>

                <!-- Form -->
                <form th:action="@{/admin/quizzes/save}" th:object="${quizForm}" method="post">
                    <!-- Hidden ID for edit -->
                    <input type="hidden" th:field="*{id}">

                    <!-- Title -->
                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">Quiz Title <span class="text-danger">*</span></label>
                        <input type="text" id="title" th:field="*{title}" class="form-control"
                               th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                               placeholder="e.g. Advanced Java & Spring Boot Essentials" required autofocus>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                    </div>

                    <!-- Description -->
                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Description</label>
                        <textarea id="description" th:field="*{description}" class="form-control" rows="3"
                                  placeholder="Briefly describe the syllabus, prerequisites, or topics covered..."></textarea>
                    </div>

                    <!-- Row for numerical parameters -->
                    <div class="row g-3 mb-3">
                        <!-- Duration -->
                        <div class="col-md-4">
                            <label for="durationMinutes" class="form-label fw-semibold">Duration (Minutes) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-clock"></i></span>
                                <input type="number" id="durationMinutes" th:field="*{durationMinutes}" min="1" max="180" class="form-control"
                                       th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid' : ''" required>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('durationMinutes')}" th:errors="*{durationMinutes}"></div>
                        </div>

                        <!-- Total Marks -->
                        <div class="col-md-4">
                            <label for="totalMarks" class="form-label fw-semibold">Total Marks <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-star"></i></span>
                                <input type="number" id="totalMarks" th:field="*{totalMarks}" min="1" class="form-control"
                                       th:classappend="${#fields.hasErrors('totalMarks')} ? 'is-invalid' : ''" required>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('totalMarks')}" th:errors="*{totalMarks}"></div>
                        </div>

                        <!-- Passing Marks -->
                        <div class="col-md-4">
                            <label for="passingMarks" class="form-label fw-semibold">Passing Marks <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-check2-circle"></i></span>
                                <input type="number" id="passingMarks" th:field="*{passingMarks}" min="1" class="form-control"
                                       th:classappend="${#fields.hasErrors('passingMarks')} ? 'is-invalid' : ''" required>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('passingMarks')}" th:errors="*{passingMarks}"></div>
                        </div>
                    </div>

                    <!-- Active Toggle -->
                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                        <label class="form-check-label fw-semibold" for="active">Publish Quiz (Visible to Students)</label>
                        <div class="form-text">If unchecked, students will not be able to see or attempt this quiz.</div>
                    </div>

                    <!-- Submit Buttons -->
                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/admin/quizzes}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            <i class="bi bi-save me-1"></i> <span th:text="${isEdit ? 'Update Quiz' : 'Save & Proceed'}">Save</span>
                        </button>
                    </div>
                </form>

            </div>

        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
