<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand text-white" th:href="@{/}">
            <i class="bi bi-patch-question-fill text-warning fs-3"></i>
            <span>QuizMaster Pro</span>
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link text-white-50" th:href="@{/}">
                        <i class="bi bi-house-door me-1"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-50" th:href="@{/about}">
                        <i class="bi bi-info-circle me-1"></i> About Project
                    </a>
                </li>

                <!-- Student specific nav links -->
                <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                    <a class="nav-link text-white-50" th:href="@{/student/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                    <a class="nav-link text-white-50" th:href="@{/student/quizzes}">
                        <i class="bi bi-journal-check me-1"></i> Available Quizzes
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                    <a class="nav-link text-white-50" th:href="@{/student/history}">
                        <i class="bi bi-clock-history me-1"></i> My History
                    </a>
                </li>

                <!-- Admin specific nav links -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-white-50" th:href="@{/admin/dashboard}">
                        <i class="bi bi-grid-fill me-1"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-white-50" th:href="@{/admin/quizzes}">
                        <i class="bi bi-collection-play me-1"></i> Manage Quizzes
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-white-50" th:href="@{/admin/students}">
                        <i class="bi bi-people me-1"></i> Students
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-white-50" th:href="@{/admin/results}">
                        <i class="bi bi-bar-chart-line me-1"></i> Reports
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <!-- Anonymous user buttons -->
                <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
                    <a th:href="@{/login}" class="btn btn-outline-light btn-sm px-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Login
                    </a>
                    <a th:href="@{/register}" class="btn btn-warning btn-sm px-3 fw-bold text-dark">
                        <i class="bi bi-person-plus me-1"></i> Register
                    </a>
                </div>

                <!-- Authenticated user info and logout -->
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
                    <div class="text-end d-none d-md-block">
                        <small class="text-white-50 d-block" style="font-size: 0.75rem;">Signed in as</small>
                        <span class="badge bg-light text-dark fw-semibold" sec:authentication="name">User</span>
                        <span class="badge bg-primary" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                        <span class="badge bg-info text-dark" sec:authorize="hasRole('STUDENT')">STUDENT</span>
                    </div>

                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-danger btn-sm text-white border-white-50 px-3">
                            <i class="bi bi-box-arrow-right me-1"></i> Logout
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>

</body>
</html>
