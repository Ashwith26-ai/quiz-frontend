<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${quiz.title + ' - Active Exam'}">Active Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Top Exam Header Bar -->
<header class="bg-white border-bottom shadow-sm sticky-top py-2">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h5 class="fw-bold text-dark mb-0 d-flex align-items-center gap-2">
                <i class="bi bi-patch-question-fill text-primary"></i>
                <span th:text="${quiz.title}">Java Programming Fundamentals</span>
            </h5>
            <small class="text-muted">
                Student: <strong th:text="${student.fullName}">Rahul Sharma</strong> &bull;
                Total Marks: <span th:text="${quiz.totalMarks}">5</span>
            </small>
        </div>

        <div class="d-flex align-items-center gap-3">
            <div id="quiz-timer-box" class="quiz-timer-box">
                <i class="bi bi-clock-history"></i>
                <span id="timer-countdown" th:data-seconds="${remainingSeconds}">00:00</span>
            </div>
        </div>
    </div>
</header>

<main class="container py-4">

    <!-- Form for Quiz Submission -->
    <form th:action="@{/student/quiz/submit}" th:object="${submissionDto}" method="post" id="quiz-form">
        <!-- Hidden Attempt ID -->
        <input type="hidden" th:field="*{attemptId}">

        <div class="row g-4">

            <!-- Left: Question Container -->
            <div class="col-lg-8">

                <!-- Loop through questions -->
                <div th:each="q, stat : ${questions}"
                     class="question-card card card-custom p-4 shadow-sm"
                     th:id="'question-card-' + ${stat.index}"
                     th:style="${stat.index == 0} ? 'display: block;' : 'display: none;'">

                    <!-- Hidden Question ID input -->
                    <input type="hidden"
                           th:name="'answers[' + ${stat.index} + '].questionId'"
                           th:value="${q.id}">

                    <!-- Question Header -->
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
                        <span class="badge bg-primary px-3 py-2 rounded-pill fw-semibold">
                            Question <span th:text="${stat.count}">1</span> of <span th:text="${questions.size()}">5</span>
                        </span>
                        <span class="badge bg-light text-secondary border px-2 py-1">
                            <span th:text="${q.marks + ' Mark(s)'}">1 Mark</span>
                        </span>
                    </div>

                    <!-- Question Text -->
                    <h5 class="fw-bold text-dark mb-4 lh-base" th:text="${q.questionText}">
                        Which of the following is not a feature of OOP in Java?
                    </h5>

                    <!-- Options list -->
                    <div class="options-container mb-4">
                        <div class="mb-2" th:each="opt : ${q.options}">
                            <input type="radio"
                                   th:name="'answers[' + ${stat.index} + '].selectedOptionId'"
                                   th:value="${opt.id}"
                                   class="option-input"
                                   th:id="'opt_' + ${opt.id}">
                            <label th:for="'opt_' + ${opt.id}" class="option-label">
                                <span class="fw-medium" th:text="${opt.optionText}">Option text here</span>
                            </label>
                        </div>
                    </div>

                    <!-- Bottom Nav Controls inside Card -->
                    <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                        <button type="button" class="btn btn-outline-secondary" id="prev-question-btn" disabled>
                            <i class="bi bi-chevron-left me-1"></i> Previous
                        </button>
                        <button type="button" class="btn btn-primary" id="next-question-btn">
                            Next Question <i class="bi bi-chevron-right ms-1"></i>
                        </button>
                        <button type="submit" class="btn btn-danger fw-bold px-4" id="submit-quiz-btn" style="display: none;">
                            <i class="bi bi-check2-all me-1"></i> Final Submit
                        </button>
                    </div>

                </div>

            </div>

            <!-- Right: Question Palette & Summary Sidebar -->
            <div class="col-lg-4">
                <div class="card card-custom p-4 shadow-sm sticky-top" style="top: 80px;">
                    <h5 class="fw-bold mb-3"><i class="bi bi-grid-3x3-gap-fill text-primary me-2"></i> Question Palette</h5>

                    <div class="d-flex flex-wrap gap-2 mb-4 justify-content-start">
                        <button type="button"
                                th:each="q, stat : ${questions}"
                                th:id="'palette-btn-' + ${stat.index}"
                                class="palette-btn"
                                th:classappend="${stat.index == 0} ? 'active' : ''"
                                th:data-index="${stat.index}"
                                th:text="${stat.count}">
                            1
                        </button>
                    </div>

                    <!-- Palette Legend -->
                    <div class="bg-light p-3 rounded-3 mb-4">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <span class="small text-muted"><i class="bi bi-circle-fill text-success me-1"></i> Answered</span>
                            <span class="fw-bold text-success" id="answered-count">0</span>
                        </div>
                        <div class="d-flex align-items-center justify-content-between">
                            <span class="small text-muted"><i class="bi bi-circle-fill text-secondary me-1"></i> Total Questions</span>
                            <span class="fw-bold text-dark" th:text="${questions.size()}">5</span>
                        </div>
                    </div>

                    <!-- Manual Final Submission Button -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-danger py-2 fw-bold shadow-sm">
                            <i class="bi bi-send-check me-1"></i> Submit Examination
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </form>

</main>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Quiz Timer & Navigation Script -->
<script th:src="@{/js/quiz-timer.js}"></script>

</body>
</html>
