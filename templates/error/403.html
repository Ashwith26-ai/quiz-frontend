<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Denied</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-custom p-5 shadow">
                <i class="bi bi-shield-lock-fill text-danger display-1 mb-3"></i>
                <h1 class="fw-extrabold text-danger">403</h1>
                <h3 class="fw-bold mb-3">Access Denied</h3>
                <p class="text-muted mb-4">
                    You do not have the required permissions to access this page or resource.
                    Please log in with the appropriate role (Administrator or Student).
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a th:href="@{/}" class="btn btn-primary px-4">
                        <i class="bi bi-house-door me-1"></i> Return Home
                    </a>
                    <a th:href="@{/login}" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Switch Account
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
